<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Redbound</title>
<meta name="description" content="Redbound: write your stories beside Myria and Jasper under a cherry tree.">
<meta name="theme-color" content="#110a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --serif:"Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  --sans:"Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  /* dawn (light) */
  --bg:#f6e7ec;
  --text:#2b1626;
  --muted:#7a5a6d;
  --glass:rgba(255,247,250,.62);
  --glass-strong:rgba(255,250,252,.86);
  --line:rgba(120,60,90,.18);
  --accent:#b8173f;
  --accent-soft:rgba(184,23,63,.12);
  --gold:#a8801f;
  --petal:#e98aa8;
  --user-bubble:rgba(184,23,63,.1);
  --focus:#b8173f;
  --shadow:0 20px 50px -24px rgba(90,30,60,.45);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#110a17;
    --text:#f1e9f0;
    --muted:#b7a2b6;
    --glass:rgba(20,10,27,.56);
    --glass-strong:rgba(24,12,32,.9);
    --line:rgba(240,200,225,.14);
    --accent:#ff5d86;
    --accent-soft:rgba(255,93,134,.14);
    --gold:#dcb96a;
    --petal:#f4b6c8;
    --user-bubble:rgba(255,93,134,.14);
    --focus:#ffb3c7;
    --shadow:0 24px 60px -24px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#110a17;
  --text:#f1e9f0;
  --muted:#b7a2b6;
  --glass:rgba(20,10,27,.56);
  --glass-strong:rgba(24,12,32,.9);
  --line:rgba(240,200,225,.14);
  --accent:#ff5d86;
  --accent-soft:rgba(255,93,134,.14);
  --gold:#dcb96a;
  --petal:#f4b6c8;
  --user-bubble:rgba(255,93,134,.14);
  --focus:#ffb3c7;
  --shadow:0 24px 60px -24px rgba(0,0,0,.8);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:16px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

.app{position:relative;height:100%;display:grid;grid-template-columns:minmax(260px,320px) 1fr minmax(360px,460px);grid-template-rows:auto 1fr;gap:0 24px;padding:18px 22px 22px;pointer-events:none}
.app > *{pointer-events:auto}

/* top bar */
.topbar{grid-column:1 / -1;display:flex;align-items:center;gap:12px;pointer-events:none}
.topbar > *{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.45rem;font-weight:600;letter-spacing:.02em;margin-right:auto}
.brand svg{width:34px;height:24px}
.icon-btn{width:42px;height:42px;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:transform .18s ease, background .2s ease, border-color .2s}
.icon-btn:hover{border-color:var(--accent)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}
.icon-btn:disabled{opacity:.4;cursor:not-allowed}

/* companion */
.companion{grid-column:1;grid-row:2;align-self:end;display:flex;flex-direction:column;align-items:center;gap:14px;padding-bottom:6px}
.frame-wrap{position:relative;width:min(260px,100%);aspect-ratio:5/6}
.frame{position:absolute;inset:0;border-radius:50% 50% 18px 18px / 40% 40% 18px 18px;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(0,0,0,.25));border:1px solid color-mix(in srgb,var(--gold) 70%,transparent);box-shadow:var(--shadow),0 0 0 6px color-mix(in srgb,var(--glass) 60%,transparent),0 0 60px -6px var(--glow,transparent);transition:box-shadow .5s ease;animation:breathe 7s ease-in-out infinite}
.frame img,.frame svg{width:100%;height:100%;object-fit:cover;display:block}
@keyframes breathe{50%{transform:translateY(-3px) scale(1.006)}}
.companion[data-state="listening"]{--glow:rgba(120,200,255,.75)}
.companion[data-state="thinking"]{--glow:color-mix(in srgb,var(--gold) 80%,transparent)}
.companion[data-state="speaking"]{--glow:color-mix(in srgb,var(--accent) 85%,transparent)}
.companion[data-state="error"]{--glow:rgba(255,80,60,.7)}
.companion[data-state="speaking"] .frame{animation:breathe 7s ease-in-out infinite, talk .5s ease-in-out infinite}
@keyframes talk{50%{filter:brightness(1.07)}}
.frame-edit{position:absolute;right:6px;bottom:6px;width:36px;height:36px}
.who{text-align:center}
.who h1{font-family:var(--serif);font-weight:600;font-size:2.4rem;line-height:1;margin:0;letter-spacing:.01em}
.state-line{display:inline-flex;align-items:center;gap:8px;margin-top:6px;font-size:.88rem;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);transition:background .3s}
.companion[data-state="listening"] .dot{background:#6cc3ff;animation:pulse 1.2s infinite}
.companion[data-state="thinking"] .dot{background:var(--gold);animation:pulse .9s infinite}
.companion[data-state="speaking"] .dot{background:var(--accent);animation:pulse .6s infinite}
.companion[data-state="error"] .dot{background:#ff5a4a}
@keyframes pulse{50%{opacity:.35;transform:scale(1.5)}}

.switcher{display:flex;gap:6px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.switcher button{display:flex;align-items:center;gap:8px;border:0;background:transparent;padding:5px 14px 5px 5px;border-radius:999px;transition:background .25s,color .25s;font-size:.92rem}
.switcher button[aria-pressed="true"]{background:var(--accent);color:#fff}
.switcher .mini{width:28px;height:28px;border-radius:50%;overflow:hidden;background:rgba(0,0,0,.2);flex:none}
.switcher .mini img,.switcher .mini svg{width:100%;height:100%;object-fit:cover;display:block}
.voice-row{display:flex;gap:8px}

/* chat */
.chat{grid-column:3;grid-row:2;display:flex;flex-direction:column;min-height:0;border-radius:26px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);box-shadow:var(--shadow);overflow:hidden;margin-top:14px}
.chat-head{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;border-bottom:1px solid var(--line)}
.chat-head h2{margin:0;font-family:var(--serif);font-size:1.35rem;font-weight:600;flex:1}
.handle{display:none}
.thread{flex:1;overflow-y:auto;padding:18px 18px 8px;display:flex;flex-direction:column;gap:14px;scroll-behavior:smooth;overscroll-behavior:contain}
.msg{max-width:88%;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.msg.user{align-self:flex-end;background:var(--user-bubble);padding:9px 14px;border-radius:18px 18px 4px 18px}
.msg.ai{align-self:flex-start;padding:2px 0 2px 14px;border-left:2px solid var(--accent)}
.msg.ai p{margin:0 0 .6em}.msg.ai p:last-child{margin:0}
.msg.err{border-left-color:#ff5a4a;color:var(--muted);font-size:.92rem}
.msg .speak-again{margin-top:4px;border:0;background:none;color:var(--muted);font-size:.8rem;padding:2px 0;display:inline-flex;gap:5px;align-items:center}
.msg .speak-again:hover{color:var(--accent)}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:pulse 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.empty{margin:auto 0;text-align:center;color:var(--muted);padding:10px 8px}
.empty p{font-family:var(--serif);font-size:1.3rem;color:var(--text);margin:0 0 12px;font-style:italic}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chips button{border:1px solid var(--line);background:var(--glass-strong);border-radius:999px;padding:7px 13px;font-size:.88rem;transition:border-color .2s,transform .15s}
.chips button:hover{border-color:var(--accent)}
.chips button:active{transform:scale(.96)}
.notice{margin:0 14px 8px;padding:9px 12px;border-radius:12px;background:var(--accent-soft);font-size:.86rem;display:none}
.notice.show{display:block}
.composer{display:flex;align-items:flex-end;gap:8px;padding:10px 12px 12px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--glass-strong);border-radius:20px;padding:10px 14px;min-height:44px;max-height:140px;line-height:1.4;outline:none;transition:border-color .2s}
.composer textarea:focus{border-color:var(--accent)}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;transition:transform .15s,opacity .2s}
.send:active{transform:scale(.9)}
.send:disabled{opacity:.4;cursor:not-allowed}
.send svg,.mic svg{width:20px;height:20px}
.mic{width:44px;height:44px;flex:none}
.mic[aria-pressed="true"]{background:#2f8fd8;animation:micpulse 1.6s infinite}
@keyframes micpulse{0%{box-shadow:0 0 0 0 rgba(108,195,255,.6)}100%{box-shadow:0 0 0 14px rgba(108,195,255,0)}}

/* settings */
dialog{border:1px solid var(--line);border-radius:24px;background:var(--glass-strong);color:var(--text);padding:0;width:min(460px,calc(100% - 28px));max-height:calc(100% - 40px);box-shadow:var(--shadow);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
dialog::backdrop{background:rgba(10,4,14,.45);backdrop-filter:blur(3px)}
dialog[open]{animation:pop .28s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}}
.dlg{padding:20px 22px 22px;display:flex;flex-direction:column;gap:16px;overflow:auto;max-height:calc(100dvh - 60px)}
.dlg h3{margin:0;font-family:var(--serif);font-size:1.6rem;font-weight:600}
.field{display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.field span{color:var(--muted)}
.field input[type=text],.field textarea,.field select{border:1px solid var(--line);background:transparent;border-radius:12px;padding:9px 12px;outline:none}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent)}
.field select option{background:var(--bg)}
.field small{color:var(--muted);font-size:.8rem;line-height:1.4}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 16px;font-size:.9rem;transition:border-color .2s,background .2s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn.danger:hover{border-color:#ff5a4a;color:#ff5a4a}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:.92rem}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.divider{height:1px;background:var(--line)}

/* avatar SVG animation */
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96.5%{transform:scaleY(.08)}}
.mouth-open{opacity:0;transform-box:fill-box;transform-origin:center}
.companion[data-state="speaking"] .mouth-open{opacity:1;animation:mouth .22s ease-in-out infinite alternate}
.companion[data-state="speaking"] .mouth-closed{opacity:0}
@keyframes mouth{from{transform:scaleY(.35)}to{transform:scaleY(1)}}
.hair-sway{transform-box:fill-box;transform-origin:50% 0;animation:sway 6s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(.8deg)}}


/* tabs */
.tabs{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tabs button{border:0;background:transparent;border-radius:999px;padding:7px 16px;font-size:.92rem;display:flex;align-items:center;gap:7px;transition:background .25s,color .25s}
.tabs button svg{width:18px;height:18px}
.tabs button[aria-selected="true"]{background:var(--accent);color:#fff}

/* studio */
.studio{display:none;grid-column:2;grid-row:2;flex-direction:column;min-height:0;margin-top:14px;border-radius:26px;background:var(--glass-strong);border:1px solid var(--line);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);box-shadow:var(--shadow);overflow:hidden}
.app.studio-on .studio{display:flex}
.st-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:62px}
.st-crumb{flex:1;min-width:0;display:flex;flex-direction:column}
.st-crumb small{color:var(--muted);font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st-crumb b{font-family:var(--serif);font-size:1.3rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.save-state{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-state::before{content:"";width:7px;height:7px;border-radius:50%;background:#5bbf7a}
.save-state[data-s="saving"]::before{background:var(--gold);animation:pulse .8s infinite}
.save-state[data-s="error"]{color:#ff6a5a}.save-state[data-s="error"]::before{background:#ff5a4a}
.st-body{flex:1;overflow-y:auto;padding:18px 18px 28px;overscroll-behavior:contain}
.st-view{animation:slidein .32s cubic-bezier(.2,.8,.2,1)}
.st-view.back{animation-name:slideback}
@keyframes slidein{from{opacity:0;transform:translateX(18px)}}
@keyframes slideback{from{opacity:0;transform:translateX(-18px)}}
.st-intro{font-family:var(--serif);font-size:1.25rem;font-style:italic;margin:0 0 14px;color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.type{text-align:left;border:1px solid var(--line);background:transparent;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;transition:border-color .2s,transform .15s,background .2s}
.type:hover{border-color:var(--accent);background:var(--accent-soft)}
.type:active{transform:scale(.98)}
.type b{font-family:var(--serif);font-size:1.3rem;font-weight:600}
.type span{font-size:.85rem;color:var(--muted);line-height:1.4}
.type i{font-style:normal;font-size:.75rem;color:var(--muted);margin-top:4px;opacity:.85}
.list{display:flex;flex-direction:column;gap:8px}
.row-item{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:16px;padding:4px 6px 4px 4px;transition:border-color .2s,background .2s}
.row-item:hover{border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}
.row-main{flex:1;min-width:0;text-align:left;border:0;background:none;padding:10px 12px;border-radius:12px;display:flex;flex-direction:column;gap:2px}
.row-main b{font-weight:500;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main span{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiny{width:32px;height:32px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted);flex:none;transition:background .2s,color .2s}
.tiny:hover{background:var(--accent-soft);color:var(--text)}
.tiny:disabled{opacity:.25;cursor:default;background:none}
.tiny svg{width:16px;height:16px}
.add-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.title-in{width:100%;border:0;background:transparent;font-family:var(--serif);font-size:2rem;font-weight:600;line-height:1.15;padding:2px 0;outline:none;border-bottom:1px solid transparent}
.title-in:focus{border-bottom-color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--text)}
.meta-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 14px;color:var(--muted);font-size:.85rem}
.fld{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.fld > span{font-size:.82rem;color:var(--muted)}
.fld textarea,.fld input,.inline-form input,.inline-form select{border:1px solid var(--line);background:color-mix(in srgb,var(--glass) 40%,transparent);border-radius:14px;padding:10px 12px;outline:none;resize:none;line-height:1.55;transition:border-color .2s}
.fld textarea:focus,.fld input:focus,.inline-form input:focus,.inline-form select:focus{border-color:var(--accent)}
.fld textarea.write{font-family:var(--serif);font-size:1.18rem;line-height:1.7;min-height:48vh;padding:16px 18px}
.inline-form{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:16px}
.inline-form input{flex:1;min-width:140px}
.inline-form select option{background:var(--bg)}
.sec-label{font-size:.82rem;color:var(--muted);margin:18px 0 8px;display:flex;justify-content:space-between}
.empty-note{color:var(--muted);font-size:.92rem;padding:14px;border:1px dashed var(--line);border-radius:16px;text-align:center}
.item-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}

/* mobile */
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;padding:10px 12px 0;gap:8px}
  .topbar{grid-column:1}
  .brand{font-size:1.25rem}
  .icon-btn{width:40px;height:40px}
  .companion{grid-column:1;grid-row:2;align-self:start;flex-direction:row;flex-wrap:wrap;align-items:center;gap:10px 12px;padding:8px 10px;border-radius:22px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  .frame-wrap{width:62px;flex:none}
  .frame{box-shadow:0 0 0 3px color-mix(in srgb,var(--glass) 60%,transparent),0 0 26px -2px var(--glow,transparent)}
  .frame-edit{display:none}
  .who{text-align:left;flex:1;min-width:0}
  .who h1{font-size:1.7rem}
  .state-line{margin-top:2px;font-size:.8rem}
  .voice-row{gap:6px}
  .voice-row .icon-btn{width:36px;height:36px}
  .switcher{width:100%;justify-content:stretch}
  .switcher button{flex:1;justify-content:center}
  .chat{grid-column:1;grid-row:3;align-self:end;margin:0 -12px;border-radius:26px 26px 0 0;border-bottom:0;height:min(46dvh,480px);transition:height .45s cubic-bezier(.2,.8,.2,1)}
  :root{padding-bottom:0}
  .chat.collapsed{height:128px}
  .chat.collapsed .thread,.chat.collapsed .notice{opacity:0;pointer-events:none}
  .handle{display:block;width:100%;border:0;background:none;padding:8px 0 0}
  .handle i{display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto}
  .chat-head{padding:6px 16px 8px}
  .msg{max-width:92%}

  .app{padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;border-radius:0;border:0;border-top:1px solid var(--line);background:var(--glass-strong);padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .tabs button{flex:1;flex-direction:column;gap:2px;font-size:.74rem;padding:6px 8px;border-radius:14px;justify-content:center}
  .tabs button svg{width:22px;height:22px}
  .tabs button[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
  .app.studio-on .companion,.app.studio-on .chat{display:none}
  .studio{grid-column:1;grid-row:2 / 4;margin:0 -12px;border-radius:24px 24px 0 0;border-bottom:0}
  .st-body{padding:14px 14px 24px}
  .title-in{font-size:1.65rem}
  .fld textarea.write{min-height:55dvh;font-size:1.1rem;padding:14px}
  .types{grid-template-columns:1fr 1fr}
  .type{padding:12px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}

<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 68 48" aria-hidden="true">
        <path d="M33 40 C 24 30 10 30 2 14 C 12 18 16 14 18 8 C 22 16 26 12 28 6 C 30 16 34 22 33 40Z" fill="#f4eee6" stroke="#caa55a" stroke-width="1.2"/>
        <path d="M35 40 C 44 30 58 30 66 14 C 56 18 52 14 50 8 C 46 16 42 12 40 6 C 38 16 34 22 35 40Z" fill="#1a0d17" stroke="#c21d4a" stroke-width="1.2"/>
        <circle cx="34" cy="42" r="3" fill="#c21d4a"/>
      </svg>
      Redbound
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button type="button" role="tab" id="tabCompanion" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4V5Z"/></svg>Companion</button>
      <button type="button" role="tab" id="tabStudio" aria-selected="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h12"/><path d="M9 7h6M9 11h4"/></svg>Studio</button>
    </nav>
    <button class="icon-btn" id="themeBtn" aria-label="Switch between dawn and night">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Companion settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </header>

  <aside class="companion" id="companion" data-state="idle" aria-label="Companion">
    <div class="frame-wrap">
      <div class="frame" id="portrait"></div>
      <button class="icon-btn frame-edit" id="portraitBtn" aria-label="Change portrait">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>
      </button>
    </div>
    <div class="who">
      <h1 id="compName">Myria</h1>
      <div class="state-line" aria-live="polite"><span class="dot"></span><span id="stateText">Resting under the tree</span></div>
    </div>
    <div class="voice-row">
      <button class="icon-btn" id="voiceBtn" aria-pressed="true" aria-label="Voice replies on">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10H4Z"/><path id="waveA" d="M16 9a4 4 0 0 1 0 6"/><path id="waveB" d="M18.5 6.5a8 8 0 0 1 0 11"/></svg>
      </button>
      <button class="icon-btn" id="stopBtn" aria-label="Stop speaking" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
    <div class="switcher" role="group" aria-label="Choose companion" id="switcher"></div>
  </aside>

  <section class="chat" id="chat" aria-label="Conversation">
    <button class="handle" id="handle" aria-label="Expand or collapse conversation" aria-expanded="true"><i></i></button>
    <div class="chat-head">
      <h2 id="chatTitle">Talk with Myria</h2>
      <button class="icon-btn" id="clearBtn" aria-label="Clear this conversation" style="width:36px;height:36px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>
      </button>
    </div>
    <div class="thread" id="thread" aria-live="polite"></div>
    <div class="notice" id="notice" role="status"></div>
    <form class="composer" id="composer">
      <label class="sr" for="input">Message</label>
      <textarea id="input" rows="1" placeholder="Say something to Myria…"></textarea>
      <button type="button" class="icon-btn mic" id="micBtn" aria-pressed="false" aria-label="Start voice conversation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button type="submit" class="send" id="sendBtn" aria-label="Send message" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </section>

  <section class="studio" id="studio" aria-label="Writing studio">
    <div class="st-head">
      <button class="icon-btn" id="stBack" aria-label="Back" style="width:38px;height:38px">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="st-crumb"><small id="stCrumb">Studio</small><b id="stTitle">Your projects</b></div>
      <span class="save-state" id="saveState" data-s="saved" aria-live="polite">Saved</span>
    </div>
    <div class="st-body" id="stBody"></div>
  </section>
</div>

<dialog id="settings" aria-labelledby="setTitle">
  <form method="dialog" class="dlg" id="setForm">
    <h3 id="setTitle">Settings</h3>
    <label class="field"><span>Companion name</span><input type="text" id="setName" maxlength="24"></label>
    <div class="field">
      <span>Portrait</span>
      <div class="row">
        <button type="button" class="btn" id="setPortrait">Upload image</button>
        <button type="button" class="btn" id="resetPortrait">Use default</button>
      </div>
      <small>Upload your reference art here. It's kept in this browser only.</small>
    </div>
    <label class="field"><span>ElevenLabs voice ID</span><input type="text" id="setVoice" autocomplete="off" spellcheck="false">
      <small>Leave empty to use your device's built-in voice.</small></label>
    <label class="field"><span>Voice engine</span>
      <select id="setEngine"><option value="eleven">ElevenLabs (uses your credits)</option><option value="device">Device voice (free)</option></select>
    </label>
    <div class="divider"></div>
    <label class="field"><span>What your companions should know</span><textarea id="setAbout" rows="3" placeholder="Your name, your current project, what you're training for…"></textarea>
      <small>Shared with both companions on every reply.</small></label>
    <label class="toggle">Calmer scene (fewer petals)<input type="checkbox" id="setCalm"></label>
    <div class="row" style="justify-content:flex-end">
      <button class="btn primary" value="save" id="saveSet">Save</button>
    </div>
  </form>
</dialog>
<input type="file" id="fileIn" accept="image/*" hidden>

<script>
(() => {
"use strict";
/* ---------------- state ---------------- */
const KEY = "redbound.v1";
const DEFAULTS = {
  active: "myria",
  voiceOn: true,
  engine: "eleven",
  about: "",
  calm: false,
  theme: null,
  companions: {
    myria: { name: "Myria", voiceId: "KBiqSCotcD7IzLEkC5z6", portrait: null, history: [], flowId: null },
    jasper: { name: "Jasper", voiceId: "T7TOOaZZ6tdlmJhBoEjH", portrait: null, history: [], flowId: null }
  }
};
let S = load();
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return structuredClone(DEFAULTS);
    const d = JSON.parse(raw);
    const out = Object.assign(structuredClone(DEFAULTS), d);
    out.companions = {
      myria: Object.assign(structuredClone(DEFAULTS.companions.myria), d.companions?.myria),
      jasper: Object.assign(structuredClone(DEFAULTS.companions.jasper), d.companions?.jasper || d.companions?.aurel)
    };
    if(out.companions.jasper.name === "Aurel") out.companions.jasper.name = "Jasper";
    if(!out.companions.jasper.voiceId) out.companions.jasper.voiceId = DEFAULTS.companions.jasper.voiceId;
    if(out.active === "aurel") out.active = "jasper";
    return out;
  }catch{ return structuredClone(DEFAULTS); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); return true; }
  catch{ showNotice("This browser couldn't save your conversation. It will reset on reload."); return false; }
}
const C = () => S.companions[S.active];

/* ---------------- theme ---------------- */
const root = document.documentElement;
const mqDark = matchMedia("(prefers-color-scheme: dark)");
function isNight(){ return S.theme ? S.theme === "dark" : mqDark.matches; }
function applyTheme(){
  if(S.theme) root.setAttribute("data-theme", S.theme); else root.removeAttribute("data-theme");
  Scene.setNight(isNight());
}
mqDark.addEventListener?.("change", () => { if(!S.theme) applyTheme(); });
$("themeBtn").onclick = () => { S.theme = isNight() ? "light" : "dark"; save(); applyTheme(); if(!C().history.length) renderThread(); };

/* ---------------- helpers ---------------- */
function $(id){ return document.getElementById(id); }
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
let noticeTimer;
function showNotice(text, ms=7000){
  const n = $("notice"); n.textContent = text; n.classList.add("show");
  clearTimeout(noticeTimer); if(ms) noticeTimer = setTimeout(()=>n.classList.remove("show"), ms);
}
const STATE_TEXT = {
  idle: () => "Resting under the tree",
  listening: () => "Listening",
  thinking: () => "Thinking",
  speaking: () => "Speaking",
  error: () => "Couldn't reach her voice"
};
function setState(s, label){
  $("companion").dataset.state = s;
  $("stateText").textContent = label || STATE_TEXT[s]();
}

function portraitHTML(key){
  const c = S.companions[key];
  return `<img src="${c.portrait || DEFAULT_PORTRAITS[key]}" alt="${escapeAttr(c.name)}">`;
}
function escapeAttr(s){ return String(s).replace(/[&"<>]/g, ch => ({"&":"&amp;",'"':"&quot;","<":"&lt;",">":"&gt;"}[ch])); }

function buildTurns(){

    if(last.role === m.role) last.content += "\n\n" + m.content;

async function send(text){
  text = text.trim();
  if(!text || activeCtrl) return;
  unlockAudio();
  stopSpeaking();
  const c = C();
  c.history.push({role:"user", content:text});
  save();
  $("input").value = ""; autosize(); updateSend();
  if(c.history.length === 1) $("thread").innerHTML = "";
  $("thread").append(bubble({role:"user", content:text}));
  const live = document.createElement("div"); live.className = "msg ai";
  live.innerHTML = `<span class="typing"><i></i><i></i><i></i></span>`;
  $("thread").append(live); scrollDown();
  setState("thinking");

  const sample = await samplePromise;
  if(!sample){
    live.remove();
    fail(c, "Replies need this page opened inside Claude. Open the published link from your Claude account to talk with " + c.name + ".");
    return;
  }
  activeCtrl = new AbortController();
  try{
    const res = await sample(buildTurns(), {
      signal: activeCtrl.signal, cache:false, modelTier:"default",
      onText: ({text}) => { setParas(live, text); live.querySelector(".typing")?.remove(); scrollDown(); }
    });
    const reply = (res.text || "").trim() || "…";
    c.history.push({role:"assistant", content:reply});
    if(c.history.length > 80) c.history.splice(0, c.history.length - 80);
    save();
    live.replaceWith(bubble({role:"assistant", content:reply}));
    scrollDown();
    activeCtrl = null;
    setState("idle");
    if(S.voiceOn) speak(reply);
    else if(voiceSession) resumeListening();
  }catch(err){
    activeCtrl = null;
    live.remove();
    const code = err?.code;
    if(code === "cancelled"){ setState("idle"); return; }
    if(code === "not_granted") fail(c, `${c.name} needs your permission to reply. Allow Claude for this page when asked, then try again.`);
    else if(code === "rate_limited") fail(c, "Too many messages at once. Wait a moment, then send again.");
    else fail(c, `${c.name} couldn't reply just now (${code || "network error"}). Your message is saved; send again to retry.`);
  }
}

async function speak(text, manual=false){

function wait(ms){ return new Promise(r => setTimeout(r, ms)); }
async function elevenSpeech(text, c, token){
  const mcp = await mcpPromise;
  if(!mcp) throw {code:"not_granted"};
  const input = {
    context: "Redbound website: speak the companion's latest chat reply aloud in their configured voice.",
    model_id: "eleven_flash_v2_5",
    prompt: text,
    voice_id: c.voiceId.trim(),
    generations_count: 1
  };
  if(c.flowId) input.flow_id = c.flowId;
  let start;
  try{ start = (await mcp.callTool("ElevenLabs", "creative_generate_speech", input, {cache:false})).payload; }
  catch(e){
    if(e?.code === "tool_error" && c.flowId){ c.flowId = null; save(); delete input.flow_id; start = (await mcp.callTool("ElevenLabs", "creative_generate_speech", input, {cache:false})).payload; }
    else throw e;
  }
  if(!start?.flow_id || !start?.session_ids?.length) throw {code:"tool_error", message:"no generation started"};
  if(c.flowId !== start.flow_id){ c.flowId = start.flow_id; save(); }
  const t0 = Date.now();
  let delay = Math.max(1, Math.min(4, start.poll_after_seconds || 2)) * 1000;
  while(Date.now() - t0 < 45000){
    await wait(delay); delay = 1500;
    if(token !== speakToken) throw {code:"cancelled"};
    const st = (await mcp.callTool("ElevenLabs", "creative_get_flow_run_status",
      {context:"Check whether the companion's spoken reply is ready.", flow_id:start.flow_id, session_ids:start.session_ids}, {cache:false})).payload;
    if(st?.has_failures) throw {code:"tool_error", message:"generation failed"};
    if(st?.all_completed){
      const url = st.media?.find(m => m.kind === "audio")?.url || st.media?.[0]?.url;
      if(!url) throw {code:"tool_error", message:"no audio returned"};
      return url;
    }
  }
  throw {code:"timeout"};
}
let lastUrl = null;
function playUrl(url, token){
  return new Promise((resolve, reject) => {
    lastUrl = url;
    const cleanup = () => { audio.onended = audio.onerror = audio.onplaying = null; };
    audio.onplaying = () => setState("speaking");
    audio.onended = () => { cleanup(); if(token === speakToken) doneSpeaking(); resolve(); };
    audio.onerror = () => { cleanup(); reject({code:"audio_blocked"}); };
    audio.src = url;
    const p = audio.play();
    p?.catch(err => { cleanup(); reject({code: err?.name === "NotAllowedError" ? "audio_blocked" : "audio_blocked"}); });
  });
}
function deviceSpeak(text, token){
  if(!("speechSynthesis" in window)){ doneSpeaking(); showNotice("Voice isn't supported in this browser."); return; }
  const u = new SpeechSynthesisUtterance(text);
  const voices = speechSynthesis.getVoices();
  const fem = /female|samantha|victoria|zira|aria|jenny|google uk english female|karen|moira|tessa|serena/i;
  const mal = /male|daniel|alex|david|guy|google uk english male|arthur|oliver|fred/i;

  u.voice = (S.active === "myria" && voices.find(v => /^en-GB/i.test(v.lang) && fem.test(v.name))) || voices.find(v => /^en/i.test(v.lang) && want.test(v.name)) || voices.find(v => /^en/i.test(v.lang)) || null;
  u.pitch = S.active === "myria" ? 1.12 : 0.85;
  u.rate = 1;
  u.onstart = () => { if(token === speakToken) setState("speaking"); };
  u.onend = u.onerror = () => { if(token === speakToken) doneSpeaking(); };
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}

function startRec(){
  if(!SR || recRunning) return;
  rec = new SR();
  rec.lang = navigator.language || "en-US";
  rec.interimResults = true;
  rec.continuous = false;
  let finalText = "";
  rec.onstart = () => { recRunning = true; setState("listening"); };
  rec.onresult = (e) => {
    let interim = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      if(r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }
    $("input").value = (finalText + interim).trim(); autosize(); updateSend();
  };
  rec.onerror = (e) => {
    recRunning = false;
    if(e.error === "not-allowed" || e.error === "service-not-allowed"){
      endVoiceSession();
      showNotice("Microphone access was blocked. Allow the microphone for this page in your browser to talk out loud.", 9000);
      setState("error", "Microphone blocked");
      setTimeout(()=>setState("idle"), 3000);
    }
  };
  rec.onend = () => {
    recRunning = false;
    const t = finalText.trim();
    if(t && voiceSession){ send(t); return; }
    if(voiceSession && !paused) setTimeout(startRec, 250);
    else if($("companion").dataset.state === "listening") setState("idle");
  };
  try{ rec.start(); }catch{ recRunning = false; }
}

function downscale(file, max){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onerror = rej;
    r.onload = () => {
      const img = new Image();
      img.onerror = rej;
      img.onload = () => {
        const s = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement("canvas");
        cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL("image/jpeg", .86));
      };
      img.src = r.result;
    };
    r.readAsDataURL(file);
  });
}

    cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    horizon = Math.round(H * (mobile ? 0.45 : 0.6));
    baseX = mobile ? W*0.5 : W*0.47;
    light = { x: mobile ? W*.8 : W*.16, y: mobile ? horizon*.3 : horizon*.2, r: Math.min(W,H) * (mobile ? .06 : .052) };
    build();
    seedParticles();
  }

  /* ---- sky ---- */
  function buildSky(p){
    let x; [skyC, x] = mk(W, horizon);
    x.fillStyle = grad(x,0,0,0,horizon,p.sky); x.fillRect(0,0,W,horizon);
    const r = rng(11);
    if(p.stars){
      /* milky way: soft painted band */
      x.save(); x.filter = `blur(${Math.round(Math.max(W,H)*.03)}px)`; x.globalCompositeOperation = "screen";
      for(let i=0;i<26;i++){
        const u = i/25, bx = W*(1.05 - u*1.1), by = horizon*(-.05 + u*.75);
        const cols = ["rgba(150,120,235,.16)","rgba(110,150,240,.14)","rgba(240,150,200,.10)"];
        x.fillStyle = cols[i%3]; x.beginPath(); x.ellipse(bx + (r()-.5)*60, by + (r()-.5)*40, W*.12, W*.035, -0.6, 0, Math.PI*2); x.fill();
      }
      x.restore();
      const n = Math.round(W*horizon/2600);
      for(let i=0;i<n;i++){ const s = r()*1.2+.3; x.fillStyle = `rgba(255,245,255,${.2+r()*.6})`; x.fillRect(r()*W, r()*horizon*.8, s, s); }
      for(let i=0;i<Math.round(W*.9);i++){
        const u = r(), g = (r()+r()+r()-1.5)*.09;
        const sx = W*(1.05 - u*1.1) + g*W*.6, sy = horizon*(-.05 + u*.75) + g*W*.35;
        x.fillStyle = `rgba(255,250,255,${.15+r()*.5})`; x.fillRect(sx, sy, r()*1.1+.3, r()*1.1+.3);
      }
    }
    /* halo */
    const h = x.createRadialGradient(light.x,light.y,light.r*.8,light.x,light.y,light.r*(night?7:10));
    h.addColorStop(0,p.halo+(night?".45)":".85)")); h.addColorStop(.35,p.halo+(night?".12)":".35)")); h.addColorStop(1,p.halo+"0)");
    x.fillStyle = h; x.fillRect(0,0,W,horizon);
    if(night){
      x.strokeStyle = "rgba(255,230,240,.12)"; x.lineWidth = 1.2; x.beginPath(); x.arc(light.x,light.y,light.r*2.4,0,Math.PI*2); x.stroke();
    }
    x.fillStyle = p.disk; x.beginPath(); x.arc(light.x,light.y,light.r,0,Math.PI*2); x.fill();
    if(night){
      x.save(); x.beginPath(); x.arc(light.x,light.y,light.r,0,Math.PI*2); x.clip();
      x.fillStyle = "rgba(170,150,200,.13)";
      for(const [dx,dy,rr] of [[-.3,-.2,.28],[.25,.15,.2],[.05,.45,.14],[-.15,.35,.1],[.4,-.35,.12]]){ x.beginPath(); x.arc(light.x+dx*light.r, light.y+dy*light.r, rr*light.r, 0, Math.PI*2); x.fill(); }
      const sh = x.createRadialGradient(light.x-light.r*.4,light.y-light.r*.4,light.r*.2,light.x,light.y,light.r*1.1);
      sh.addColorStop(0,"rgba(255,255,255,0)"); sh.addColorStop(1,"rgba(255,190,215,.35)"); x.fillStyle = sh; x.fillRect(light.x-light.r,light.y-light.r,light.r*2,light.r*2);
      x.restore();
    }
    twinkles = [];
    if(p.stars){ for(let i=0;i<(mobile?18:34);i++) twinkles.push({x:r()*W, y:r()*horizon*.7, s:.8+r()*1.8, ph:r()*6.28, sp:.8+r()*2, big:i<6}); }
  }

  /* ---- clouds: cel-shaded cumulus ---- */
  function cloudLayer(p, seed, baseY, ch, count, widthMul, speed, alpha){
    const Wc = Math.round(W*widthMul), r = rng(seed);
    let [c, x] = mk(Wc, horizon);
    const clouds = [];
    for(let i=0;i<count;i++){
      const cw = ch*(2.2 + r()*2.6), cx = (i + r()*.6) / count * Wc, cy = baseY + (r()-.5)*ch*.6;
      const puffs = [];
      const n = 7 + Math.floor(r()*6);
      for(let j=0;j<n;j++){
        const u = j/(n-1), arch = Math.sin(u*Math.PI);
        const pr = ch*(.22 + arch*.34 + r()*.14);
        puffs.push({x: cx - cw/2 + u*cw + (r()-.5)*ch*.2, y: cy - arch*ch*.45 - r()*ch*.15, r: pr});
      }
      clouds.push({cx, cy, cw, puffs});
    }
    for(const off of [-Wc, 0, Wc]){
      for(const cl of clouds){
        const [tc, tx] = mk(cl.cw + cl.puffs.reduce((m,q)=>Math.max(m,q.r),0)*3, ch*2.2);
        const ox = cl.cx - cl.cw/2 - ch, oy = cl.cy - ch*1.5;
        const shape = (dx=0,dy=0,s=1) => { tx.beginPath(); for(const q of cl.puffs){ tx.moveTo(q.x-ox+dx+q.r*s, q.y-oy+dy); tx.arc(q.x-ox+dx, q.y-oy+dy, q.r*s, 0, Math.PI*2); } };
        shape(); tx.fillStyle = p.cloud.rim; tx.fill();
                tx.globalCompositeOperation = "source-atop";
        shape(ch*.07, ch*.09, .96); tx.fillStyle = p.cloud.mid; tx.fill();
        shape(ch*.16, ch*.24, .9); tx.fillStyle = p.cloud.shadow; tx.fill();
        tx.fillStyle = grad(tx,0,cl.cy-oy-ch*.4,0,cl.cy-oy+ch*.2,[[0,"rgba(0,0,0,0)"],[1,p.cloud.base]]);
        tx.fillRect(0,0,tc.width,tc.height);
        tx.globalCompositeOperation = "source-over";
        x.globalAlpha = alpha; x.drawImage(tc, ox + off, oy, tc.width/dpr, tc.height/dpr); x.globalAlpha = 1;
      }
    }
    return {c, Wc, speed, x: 0};
  }

  /* ---- mountains, torii, bank ---- */
  function buildLand(p){
    let x; [landC, x] = mk(W, horizon+40);
    const r = rng(23);
    const layers = [ {amp:.2, f:[.004,.011,.027], col:p.mtn[0], a:.9}, {amp:.15, f:[.006,.017,.04], col:p.mtn[1], a:1}, {amp:.07, f:[.009,.023,.06], col:p.mtn[2], a:1} ];
    layers.forEach((L,li) => {
      const s = [r()*10, r()*10, r()*10], pts = [];
      const peaks = Array.from({length: 3 + li*2 + (mobile?0:2)}, () => ({x: r()*W*1.2 - W*.1, h: .35 + r()*.65, w: W*(.12 + r()*.2)/(1+li*.4)}));
      for(let px=-10; px<=W+10; px+=4){
        let v = .12;
        for(const k of peaks){ const d = Math.abs(px - k.x)/k.w; if(d < 1) v = Math.max(v, k.h*Math.pow(1-d, 1.35)); }
        v += .04*Math.sin(px*L.f[1]+s[1]) + .025*Math.sin(px*L.f[2]+s[2]);
        pts.push([px, horizon - horizon*L.amp*1.6*v]);
      }
      x.beginPath(); x.moveTo(-10, horizon+2); for(const [px,py] of pts) x.lineTo(px,py); x.lineTo(W+10, horizon+2); x.closePath();
      x.globalAlpha = L.a; x.fillStyle = grad(x,0,horizon-horizon*L.amp,0,horizon,[[0,L.col[0]],[1,L.col[1]]]); x.fill();
      x.globalAlpha = li === 0 ? .35 : .18; x.strokeStyle = p.ridge; x.lineWidth = 1;
      x.beginPath(); pts.forEach(([px,py],i) => i ? x.lineTo(px,py) : x.moveTo(px,py)); x.stroke();
      x.globalAlpha = 1;
      /* atmospheric haze at the base */
      x.fillStyle = grad(x,0,horizon-horizon*L.amp*.6,0,horizon,[[0,"rgba(0,0,0,0)"],[1, night ? "rgba(160,80,140,.28)" : "rgba(255,236,220,.45)"]]);
      x.fillRect(0,horizon-horizon*L.amp,W,horizon*L.amp);
    });
    /* far shore line */
    x.fillStyle = p.bank; x.fillRect(0, horizon-2, W, 4);
    /* torii on the far shore */
    const tx = mobile ? W*.16 : W*.3, th = Math.min(H*.075, 70) * (mobile ? .8 : 1), tw = th*1.15, ty = horizon;
    x.save(); x.translate(tx, ty);
    x.fillStyle = p.torii;
    x.fillRect(-tw*.36, -th, tw*.09, th); x.fillRect(tw*.27, -th, tw*.09, th);
    x.fillRect(-tw*.46, -th*.74, tw*.92, th*.08);
    x.beginPath(); x.moveTo(-tw*.6, -th*1.02); x.quadraticCurveTo(0, -th*.9, tw*.6, -th*1.02); x.lineTo(tw*.55,-th*.9); x.quadraticCurveTo(0,-th*.8,-tw*.55,-th*.9); x.closePath(); x.fill();
    x.fillStyle = p.toriiDark; x.fillRect(-tw*.55, -th*.93, tw*1.1, th*.05);
    x.fillRect(-tw*.3, -th, tw*.03, th); x.fillRect(tw*.33, -th, tw*.03, th);
    x.restore();
    /* island under the tree */
    const size = treeSize();
    x.fillStyle = p.bank; x.beginPath(); x.ellipse(baseX, horizon+3, size*.26, size*.045, 0, Math.PI, 0); x.fill();
    x.strokeStyle = p.bankRim; x.globalAlpha = .6; x.lineWidth = 1.5;
    x.beginPath(); x.ellipse(baseX, horizon+3, size*.26, size*.045, 0, Math.PI*1.05, Math.PI*1.6); x.stroke(); x.globalAlpha = 1;
    /* grass tufts on the island */
    x.strokeStyle = p.bank; x.lineWidth = 1.2;
    for(let i=0;i<70;i++){ const gx = baseX + (r()-.5)*size*.48, gh = 3 + r()*size*.025; x.beginPath(); x.moveTo(gx, horizon+1); x.quadraticCurveTo(gx+2, horizon-gh*.6, gx+(r()-.3)*5, horizon-gh); x.stroke(); }
  }
  function treeSize(){ return mobile ? Math.min(horizon*0.66, W*0.8) : Math.min(horizon*0.84, W*0.5); }

  /* ---- tree: cel-shaded blossoms ---- */
  function buildTree(p){
    let tx; [treeC, tx] = mk(W, horizon+10);
    clusters = [];
    const tr = rng(7), size = treeSize(), segs = [];
    function grow(x0,y0,ang,len,w,d){
      const x1 = x0 + Math.cos(ang)*len, y1 = y0 + Math.sin(ang)*len;
      const bend = (tr()-.5)*len*.35;
      const cx = (x0+x1)/2 + Math.cos(ang+Math.PI/2)*bend, cy = (y0+y1)/2 + Math.sin(ang+Math.PI/2)*bend;
      segs.push({x0,y0,x1,y1,cx,cy,w,d});
      if(d <= 2) clusters.push({x:x1,y:y1,r:size*(0.03+(2-d)*0.007)});
      if(d === 3 && tr() < .85) clusters.push({x:x1,y:y1,r:size*.027});
      if(d === 4 && tr() < .4) clusters.push({x:x1,y:y1,r:size*.022});
      if(d <= 1 && tr() < .35) clusters.push({x:cx,y:cy,r:size*.022});
      if(d === 0) return;
      const n = d > 5 ? 2 : (tr() < .55 ? 2 : 3);
      for(let i=0;i<n;i++){
        let na = ang + (i - (n-1)/2) * (0.55 + tr()*0.35) + (tr()-.5)*0.3;
        na += (-Math.PI/2 - na) * -0.08;
        grow(x1,y1,na,len*(0.7+tr()*.16),w*.66,d-1);
      }
    }
    grow(baseX, horizon+4, -Math.PI/2 - 0.08, size*.26, size*.05, mobile ? 7 : 8);
    tx.lineCap = "round";
    const lightLeft = light.x < baseX ? -1 : 1;
    for(const s of segs){ tx.strokeStyle = p.bark; tx.lineWidth = Math.max(.8, s.w); tx.beginPath(); tx.moveTo(s.x0,s.y0); tx.quadraticCurveTo(s.cx,s.cy,s.x1,s.y1); tx.stroke(); }
    tx.globalAlpha = .55;
    for(const s of segs){ if(s.w < 2.5) continue; const o = s.w*.32*lightLeft; tx.strokeStyle = p.barkRim; tx.lineWidth = Math.max(.8, s.w*.14); tx.beginPath(); tx.moveTo(s.x0+o,s.y0); tx.quadraticCurveTo(s.cx+o,s.cy,s.x1+o,s.y1); tx.stroke(); }
    tx.globalAlpha = 1;
    /* build blob clumps once, then paint in shadow → mid → light passes for a cohesive painted mass */
    const blobs = clusters.map(c => { const n = 5 + Math.floor(tr()*4); return Array.from({length:n}, () => { const a = tr()*6.28, d = Math.sqrt(tr())*c.r*.9; return {x:c.x+Math.cos(a)*d, y:c.y+Math.sin(a)*d*.75, r:c.r*(.45+tr()*.35)}; }); });
    const lx = lightLeft * -1;  /* offset away from light for shadow */
    tx.save(); tx.filter = `blur(${Math.max(4,Math.round(size*.03))}px)`; tx.globalAlpha = night ? .35 : .3; tx.fillStyle = p.bloom.mid;
    for(const c of clusters){ tx.beginPath(); tx.arc(c.x,c.y,c.r*1.6,0,Math.PI*2); tx.fill(); }
    tx.restore();
    const pass = (col, dx, dy, s, a) => { tx.globalAlpha = a; tx.fillStyle = col; tx.beginPath(); for(const b of blobs) for(const q of b){ tx.moveTo(q.x+dx*q.r+q.r*s, q.y+dy*q.r); tx.arc(q.x+dx*q.r, q.y+dy*q.r, q.r*s, 0, Math.PI*2); } tx.fill(); };
    pass(p.bloom.shadow, lx*.16, .22, 1, 1);
    pass(p.bloom.mid, lx*-.03, -.04, .9, 1);
    const lit = blobs.map((b,ci) => b.filter(q => (q.x - clusters[ci].x)*(-lx) + (clusters[ci].y - q.y) > clusters[ci].r*.05));
    tx.globalAlpha = .85; tx.fillStyle = p.bloom.light; tx.beginPath();
    for(const b of lit) for(const q of b){ const cx = q.x - lx*q.r*.32, cy = q.y - q.r*.38; tx.moveTo(cx+q.r*.42, cy); tx.arc(cx, cy, q.r*.42, 0, Math.PI*2); }
    tx.fill();
    tx.globalAlpha = 1;
    for(const c of clusters){
      for(let i=0;i<5;i++){
        const a = tr()*6.28, d = tr()*c.r*1.15;
        tx.fillStyle = tr() < .35 ? p.bloom.spark : p.bloom.light; tx.globalAlpha = .4 + tr()*.4;
        tx.beginPath(); tx.arc(c.x+Math.cos(a)*d, c.y+Math.sin(a)*d*.8, size*(0.0025+tr()*.003), 0, Math.PI*2); tx.fill();
      }
    }
    tx.globalAlpha = 1;
  }

  function build(){
    const p = P();
    buildSky(p);
    const cb = mobile ? .7 : 1;
    cloudLayers = [
      cloudLayer(p, 31, horizon*.42, horizon*.12*cb, mobile ? 2 : 4, 1.8, 4, night ? .7 : .95),
      cloudLayer(p, 57, horizon*.7, horizon*.16*cb, mobile ? 3 : 5, 1.5, 1.6, night ? .85 : 1)
    ];
    buildLand(p);
    buildTree(p);
    let wx; [waterC, wx] = mk(W, H-horizon);
    wx.fillStyle = grad(wx,0,0,0,H-horizon,p.water); wx.fillRect(0,0,W,H-horizon);
    let rx; [reflC, rx] = mk(W, horizon);
    rx.save(); rx.translate(0,horizon); rx.scale(1,-1);
    rx.drawImage(skyC,0,0,W,horizon);
    for(const L of cloudLayers) rx.drawImage(L.c, 0, 0, W*dpr, L.c.height, 0, 0, W, horizon);
    rx.drawImage(landC,0,0,W,horizon+40); rx.drawImage(treeC,0,0,W,horizon+10); rx.restore();
    rx.globalCompositeOperation = "source-atop";
    rx.fillStyle = grad(rx,0,0,0,horizon, night ? [[0,"rgba(20,10,50,.25)"],[1,"rgba(6,4,24,.95)"]] : [[0,"rgba(90,130,200,.18)"],[1,"rgba(50,80,150,.85)"]]);
    rx.fillRect(0,0,W,horizon);
    let vx; [vignC, vx] = mk(W, H);
    const vg = vx.createRadialGradient(W/2,H*.45,Math.min(W,H)*.35,W/2,H*.5,Math.max(W,H)*.8);
    vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,p.vign); vx.fillStyle = vg; vx.fillRect(0,0,W,H);
    let gx; [glowC, gx] = mk(32,32);
    const gg = gx.createRadialGradient(16,16,0,16,16,16); const m = p.mote;
    gg.addColorStop(0,`rgba(${m},1)`); gg.addColorStop(.25,`rgba(${m},.6)`); gg.addColorStop(1,`rgba(${m},0)`);
    gx.fillStyle = gg; gx.fillRect(0,0,32,32);
    sprites = [[p.bloom.light,p.bloom.mid],[p.bloom.mid,p.bloom.shadow],["#ffffff",p.bloom.light],[p.bloom.light,p.bloom.shadow]].map(([a,b]) => {
      const [c, s] = mk(20,20);
      s.translate(10,10);
      s.fillStyle = grad(s,-6,-8,6,8,[[0,a],[1,b]]);
      s.beginPath(); s.moveTo(0,-8); s.bezierCurveTo(7,-7,8,4,0,9); s.bezierCurveTo(-8,4,-7,-7,0,-8); s.fill();
      s.globalCompositeOperation = "destination-out"; s.beginPath(); s.moveTo(-2,-9); s.lineTo(0,-5); s.lineTo(2,-9); s.fill();
      return c;
    });
    const r = rng(99);
    grass = [];
    const gh = Math.min(H*.2, 170) * (mobile ? .7 : 1);
    for(const side of [0,1]){
      const n = mobile ? 26 : 40;
      for(let i=0;i<n;i++){
        const u = Math.pow(r(), 1.6), x = side ? W - u*W*.3 : u*W*.3;
        grass.push({x, h: gh*(1 - u*.7)*(.5+r()*.6), lean: (side ? -1 : 1)*(.1 + r()*.35), w: 2 + r()*3, ph: r()*6.28});
      }
    }
    streaks = Array.from({length: mobile ? 14 : 26}, () => ({x:r()*W, y: horizon + 6 + Math.pow(r(),1.4)*(H-horizon-10), len: 20+r()*90, ph:r()*6.28, sp:.3+r()*.6}));
  }

  function count(){ const base = mobile ? 60 : 130; return reduceMotion ? 18 : calm ? Math.round(base*.4) : base; }
  function spawn(p, initial){
    const fromTree = Math.random() < .72 && clusters.length;
    if(fromTree){ const c = clusters[Math.floor(Math.random()*clusters.length)]; p.x = c.x + (Math.random()-.5)*c.r*2; p.y = c.y + (Math.random()-.5)*c.r; }
    else { p.x = Math.random()*W*1.2 - W*.1; p.y = -20 - Math.random()*H*.3; }
    if(initial) p.y += Math.random()*(H-p.y)*.6;
    p.z = .35 + Math.random()*.65;
    p.land = horizon + 6 + Math.pow(p.z,1.6)*(H - horizon - 12);
    if(p.y > p.land - 4) p.y = p.land - 40;
    p.size = 6 + p.z*11;
    p.vx = 0; p.fall = (.35 + Math.random()*.4) * (reduceMotion ? .5 : 1);
    p.rot = Math.random()*6.28; p.vr = (Math.random()-.5)*.04;
    p.phase = Math.random()*6.28; p.flip = .8 + Math.random()*1.8;
    p.sprite = sprites[Math.floor(Math.random()*sprites.length)];
    return p;
  }
  function seedParticles(){
    petals = Array.from({length:count()}, () => spawn({}, true));
    ripples = []; floaters = [];
    const n = reduceMotion ? 6 : calm ? 10 : (mobile ? 14 : 26);
    motes = Array.from({length:n}, () => ({x:Math.random()*W, y:horizon*.5 + Math.random()*(H-horizon*.5), vx:(Math.random()-.5)*.2, vy:-(.05+Math.random()*.18), ph:Math.random()*6.28, s:4+Math.random()*8}));
  }
  function ripple(x,y,s){ if(ripples.length > 70) ripples.shift(); ripples.push({x,y,r:2,max:18+s*38}); }

  function frame(now){
    if(!running) return;
    const dt = Math.min(50, now - last)/16.67; last = now; t += dt/60;
    const p = P();
    wind += ((0.35 + Math.sin(t*.13)*.35 + gust) - wind)*.02*dt;
    gust *= Math.pow(.96, dt);

    ctx.drawImage(skyC,0,0,W,horizon);
    for(const s of twinkles){
      const a = .35 + .65*Math.abs(Math.sin(t*s.sp + s.ph));
      ctx.fillStyle = `rgba(255,248,255,${a})`; ctx.fillRect(s.x-s.s/2, s.y-s.s/2, s.s, s.s);
      if(s.big){ ctx.globalAlpha = a*.6; ctx.fillRect(s.x-s.s*3, s.y-.4, s.s*6, .8); ctx.fillRect(s.x-.4, s.y-s.s*3, .8, s.s*6); ctx.globalAlpha = 1; }
    }
    for(const L of cloudLayers){
      if(!reduceMotion) L.x = (L.x + L.speed*dt/60) % L.Wc;
      const sx = L.x, w1 = Math.min(W, L.Wc - sx);
      ctx.drawImage(L.c, sx*dpr, 0, w1*dpr, L.c.height, 0, 0, w1, horizon);
      if(w1 < W) ctx.drawImage(L.c, 0, 0, (W-w1)*dpr, L.c.height, w1, 0, W-w1, horizon);
    }
    ctx.drawImage(landC,0,0,W,horizon+40);
    const sway = reduceMotion ? 0 : Math.sin(t*.45)*.006 + wind*.003;
    ctx.save(); ctx.translate(baseX, horizon); ctx.rotate(sway); ctx.drawImage(treeC,-baseX,-horizon,W,horizon+10); ctx.restore();

    ctx.drawImage(waterC,0,horizon,W,H-horizon);
    const rh = H - horizon, step = mobile ? 5 : 3;
    ctx.globalAlpha = night ? .5 : .5;
    for(let y=0; y<rh && y<horizon; y+=step){
      const dx = reduceMotion ? 0 : Math.sin(y*.09 + t*1.6)*(0.6 + y*.03) + Math.sin(y*.023 - t*.7)*1.5;
      ctx.drawImage(reflC, 0, y*dpr, reflC.width, step*dpr, dx, horizon+y, W, step);
    }
    ctx.globalAlpha = 1;
    /* light path on the water */
    for(let i=0;i<18;i++){
      const yy = horizon + 5 + i*i*1.3; if(yy > H) break;
      const w = light.r*(1.9 - i*.07)*(0.55+0.45*Math.sin(t*2 + i*1.7));
      ctx.fillStyle = night ? `rgba(255,228,240,${.4 - i*.02})` : `rgba(255,250,230,${.6 - i*.03})`;
      ctx.fillRect(light.x - w/2 + Math.sin(t+i)*4, yy, Math.max(0,w), 1.6);
    }
    /* painted highlight streaks */
    for(const s of streaks){
      const a = Math.max(0, Math.sin(t*s.sp + s.ph)) * (night ? .28 : .5);
      if(a < .02) continue;
      ctx.fillStyle = `rgba(255,255,255,${a})`;
      ctx.fillRect(s.x + Math.sin(t*.3+s.ph)*10, s.y, s.len*(.6+.4*Math.sin(t*.7+s.ph)), 1.2);
    }
    const mg = ctx.createLinearGradient(0,horizon-40,0,horizon+50);
    mg.addColorStop(0,"rgba(255,255,255,0)"); mg.addColorStop(.5,p.mist); mg.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle = mg; ctx.fillRect(0,horizon-40,W,90);

    ctx.lineWidth = 1;
    for(let i=ripples.length-1;i>=0;i--){
      const r = ripples[i]; r.r += .35*dt*(1+r.max/40); const a = .75*(1 - r.r/r.max);
      if(a <= 0){ ripples.splice(i,1); continue; }
      ctx.strokeStyle = night ? `rgba(255,210,230,${a})` : `rgba(255,255,255,${a})`;
      ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r, r.r*.28, 0, 0, Math.PI*2); ctx.stroke();
      if(r.r > 8){ ctx.beginPath(); ctx.ellipse(r.x, r.y, r.r*.55, r.r*.15, 0, 0, Math.PI*2); ctx.stroke(); }
    }
    for(let i=floaters.length-1;i>=0;i--){
      const f = floaters[i]; f.life -= dt/60;
      if(f.life <= 0 || f.x < -30 || f.x > W+30){ floaters.splice(i,1); continue; }
      f.x += (wind*.25 + Math.sin(t*.5+f.phase)*.1)*f.z*dt; f.rot += f.vr*dt;
      ctx.globalAlpha = Math.min(1, f.life/2) * .9;
      ctx.save(); ctx.translate(f.x, f.y + Math.sin(t*1.2+f.phase)*.6); ctx.scale(1,.42); ctx.rotate(f.rot);
      ctx.drawImage(f.sprite, -f.size/2, -f.size/2, f.size, f.size); ctx.restore();
    }
    ctx.globalAlpha = 1;
    for(const q of petals){
      q.vx += ((wind + Math.sin(t*.9 + q.phase)*.5) - q.vx)*.03*dt;
      q.x += q.vx*q.z*1.2*dt;
      q.y += q.fall*(.5+q.z)*dt*(1 + Math.sin(t*2+q.phase)*.15);
      q.rot += q.vr*dt;
      if(q.y >= q.land){
        if(q.x > -10 && q.x < W+10){
          ripple(q.x, q.land, q.z);
          if(floaters.length < 140) floaters.push({x:q.x,y:q.land,z:q.z,size:q.size,rot:q.rot,vr:(Math.random()-.5)*.004,phase:q.phase,sprite:q.sprite,life:10+Math.random()*10});
        }
        spawn(q, false); continue;
      }
      if(q.x > W+40) q.x = -30; if(q.x < -40) q.x = W+30;
      const fl = Math.cos(t*q.flip + q.phase);
      ctx.save(); ctx.translate(q.x,q.y); ctx.rotate(q.rot); ctx.scale(1, Math.max(.15, Math.abs(fl)));
      ctx.globalAlpha = .6 + q.z*.4;
      ctx.drawImage(q.sprite, -q.size/2, -q.size/2, q.size, q.size);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
    /* drifting light motes */
    ctx.globalCompositeOperation = "lighter";
    for(const m of motes){
      m.x += (m.vx + wind*.05)*dt; m.y += m.vy*dt;
      if(m.y < horizon*.3 || m.x < -20 || m.x > W+20){ m.y = H + 10; m.x = Math.random()*W; }
      const a = (night ? .5 : .35) * (.5 + .5*Math.sin(t*1.5 + m.ph));
      ctx.globalAlpha = a; ctx.drawImage(glowC, m.x - m.s, m.y - m.s, m.s*2, m.s*2);
    }
    /* light rays */
    if(!reduceMotion){
      for(let i=0;i<7;i++){
        const ang = (light.x < W/2 ? .35 : Math.PI - .35 - .7) + i*.11 + Math.sin(t*.2+i)*.015;
        const len = Math.max(W,H)*1.2, wdt = .025 + (i%3)*.012;
        ctx.globalAlpha = p.rays*(.55 + .45*Math.sin(t*.4 + i*1.3));
        const g = ctx.createLinearGradient(light.x, light.y, light.x + Math.cos(ang)*len*.7, light.y + Math.sin(ang)*len*.7);
        g.addColorStop(0, night ? "rgba(255,210,235,.9)" : "rgba(255,244,210,1)"); g.addColorStop(1,"rgba(255,255,255,0)");
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(light.x, light.y);
        ctx.lineTo(light.x + Math.cos(ang-wdt)*len, light.y + Math.sin(ang-wdt)*len);
        ctx.lineTo(light.x + Math.cos(ang+wdt)*len, light.y + Math.sin(ang+wdt)*len); ctx.closePath(); ctx.fill();
      }
    }
    ctx.globalCompositeOperation = "source-over"; ctx.globalAlpha = 1;
    /* foreground grass silhouettes */
    ctx.fillStyle = p.grass;
    for(const g of grass){
      const sw = reduceMotion ? 0 : Math.sin(t*1.1 + g.ph)*.06 + wind*.03;
      const tipX = g.x + (g.lean + sw)*g.h, tipY = H - g.h;
      ctx.beginPath(); ctx.moveTo(g.x - g.w, H+2);
      ctx.quadraticCurveTo(g.x + (g.lean+sw)*g.h*.3, H - g.h*.55, tipX, tipY);
      ctx.quadraticCurveTo(g.x + (g.lean+sw)*g.h*.3 + g.w*.6, H - g.h*.5, g.x + g.w, H+2);
      ctx.fill();
    }
    ctx.drawImage(vignC,0,0,W,H);
    requestAnimationFrame(frame);
  }

  addEventListener("pointermove", e => {
    if(lastPX !== null){ const dx = e.clientX - lastPX; gust = Math.max(-3, Math.min(3, gust + dx*.012)); }
    lastPX = e.clientX;
  }, {passive:true});
  cv.addEventListener("pointerdown", e => { if(e.clientY > horizon){ ripple(e.clientX, e.clientY, 1); ripple(e.clientX, e.clientY, .5); } });
  document.addEventListener("visibilitychange", () => {
    running = !document.hidden;
    if(running){ last = performance.now(); requestAnimationFrame(frame); }
  });
  let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(resize, 150); });

  return {
    start(){ resize(); requestAnimationFrame(t0 => { last = t0; frame(t0); }); },
    setNight(v){ if(night === v && skyC) return; night = v; if(W){ build(); petals.forEach(q => q.sprite = sprites[Math.floor(Math.random()*sprites.length)]); floaters = []; } },
    setCalm(v){ calm = v; if(W) seedParticles(); },
    setAccent(){}
  };
})();

  let saveTimer = null;
  function setSave(state){ const el = $("saveState"); el.dataset.s = state; el.textContent = state === "saving" ? "Saving…" : state === "error" ? "Not saved: storage full" : "Saved"; }

  }
  function persist(){ setSave("saving"); clearTimeout(saveTimer); saveTimer = setTimeout(persistNow, 450); }
  addEventListener("beforeunload", () => { if(saveTimer) persistNow(); });
  document.addEventListener("visibilitychange", () => { if(document.hidden && saveTimer) persistNow(); });

  const nav = P.nav;           /* {pid, sid, iid} */

    up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>',
    down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>',
    del:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>'
  };
  function el(tag, attrs={}, ...kids){
    const e = document.createElement(tag);
    for(const [k,v] of Object.entries(attrs)){
      if(k === "class") e.className = v; else if(k === "html") e.innerHTML = v;
      else if(k.startsWith("on")) e[k] = v; else if(v !== false && v != null) e.setAttribute(k, v === true ? "" : v);
    }
    for(const k of kids.flat()) if(k != null) e.append(k.nodeType ? k : document.createTextNode(k));
    return e;
  }
  function tiny(icon, label, fn, disabled){ return el("button",{type:"button",class:"tiny","aria-label":label,title:label,html:ICON[icon],onclick:fn,disabled}); }
  function move(arr, i, d){ const j = i + d; if(j < 0 || j >= arr.length) return; [arr[i],arr[j]] = [arr[j],arr[i]]; persistNow(); render(true); }
  function grow(t){ t.style.height = "auto"; t.style.height = t.scrollHeight + 2 + "px"; }

  function header(crumb, title){ $("stCrumb").textContent = crumb; $("stTitle").textContent = title; $("stBack").style.visibility = nav.pid ? "visible" : "hidden"; }

  function render(keepScroll){
    const body = $("stBody");
    const y = body.scrollTop;
    body.innerHTML = "";
    const v = el("div",{class:"st-view" + (dir === "back" ? " back" : "")});
    if(keepScroll) v.style.animation = "none";
    if(!proj()){ nav.pid = nav.sid = nav.iid = null; viewProjects(v); }
    else if(!sect()){ nav.sid = nav.iid = null; viewProject(v); }
    else if(!item()){ nav.iid = null; viewSection(v); }
    else viewItem(v);
    body.append(v);
    body.scrollTop = keepScroll ? y : 0;
    dir = "fwd";
  }

  function viewProjects(v){
    header("Studio", "Your projects");
    if(P.projects.length){
      v.append(el("div",{class:"sec-label"},"Projects"));
      const list = el("div",{class:"list"});
      P.projects.forEach(p => {
        const t = TYPES[p.type] || TYPES.custom;
        list.append(el("div",{class:"row-item"},
          el("button",{type:"button",class:"row-main",onclick:()=>go({pid:p.id})}, el("b",{},p.title || "Untitled"), el("span",{}, `${t.label}, ${projectWords(p).toLocaleString()} words`)),
          tiny("del","Delete project",()=>{ if(confirm(`Delete "${p.title || "Untitled"}" and everything in it? This can't be undone.`)){ P.projects = P.projects.filter(x=>x!==p); persistNow(); render(true);} })

        el("b",{},t.label), el("span",{},t.desc), el("i",{}, t.sections.map(s=>s[0]).join(", "))));
    }
    v.append(grid);
  }
  function create(type){
    const t = TYPES[type];
    const p = {id:uid(), type, title:"", logline:"", created:Date.now(),
      sections: t.sections.map(([name,kind]) => ({id:uid(), name, kind, items:[]}))};
    P.projects.unshift(p);
    go({pid:p.id});
    setTimeout(() => $("stBody").querySelector(".title-in")?.focus(), 50);
  }

  function viewProject(v){
    const p = proj(), t = TYPES[p.type] || TYPES.custom;

        tiny("edit","Rename section",()=>{ const n = prompt("Rename section", s.name); if(n && n.trim()){ s.name = n.trim(); persistNow(); render(true);} }),
        tiny("del","Delete section",()=>{ if(confirm(`Delete the "${s.name}" section${s.items.length?` and its ${s.items.length} item(s)`:""}? This can't be undone.`)){ p.sections.splice(i,1); persistNow(); render(true);} })

  }

  function viewSection(v){
    const p = proj(), s = sect(), k = KINDS[s.kind] || KINDS.notes;
    header(p.title || "Untitled", s.name);
    if(!s.items.length) v.append(el("div",{class:"empty-note"}, `No ${pl(2,k.noun)} yet.`));
    const list = el("div",{class:"list"});
    s.items.forEach((it,i) => {
      const first = Object.values(it.f||{}).find(x => x && x.trim()) || "";
      const w = itemWords(it);
      list.append(el("div",{class:"row-item"},
        el("button",{type:"button",class:"row-main",onclick:()=>go({pid:p.id,sid:s.id,iid:it.id})}, el("b",{},it.title || "Untitled " + k.noun), el("span",{}, (w?`${w.toLocaleString()} words. `:"") + (first.slice(0,90) || "Empty"))),
        tiny("up","Move up",()=>move(s.items,i,-1), i===0),

      ));

    add.append(el("button",{type:"button",class:"btn primary",onclick:()=>{
      const n = s.items.length + 1;

    for(const f of k.fields){

      const ta = el("textarea",{rows: f.write ? "12" : f.big ? "5" : "2", class: f.write ? "write" : "", placeholder:f.ph || "", "aria-label": f.label || it.title || k.noun});
      ta.value = it.f[f.k] || "";
      ta.oninput = () => { it.f[f.k] = ta.value; wc.textContent = `${itemWords(it).toLocaleString()} words`; if(!f.write) grow(ta); persist(); };
      lab.append(ta); v.append(lab);

    }
    const acts = el("div",{class:"item-actions"});
    const ask = el("button",{type:"button",class:"btn primary"}, `Ask ${C().name} about this`);
    ask.onclick = () => {

      setView("companion");
      const inp = $("input");
      inp.value = `Can you look at my ${k.noun} "${it.title || "untitled"}" in ${s.name} and help me push it further?`;
      inp.dispatchEvent(new Event("input")); inp.focus();
    };
    const del = el("button",{type:"button",class:"btn danger"}, `Delete ${k.noun}`);
    del.onclick = () => { if(confirm(`Delete "${it.title || "this " + k.noun}"? This can't be undone.`)){ s.items = s.items.filter(x=>x!==it); persistNow(); back(); } };
    acts.append(ask, del);
    v.append(acts);
  }

  async function exportProject(p){
    const t = TYPES[p.type] || TYPES.custom;
    let md = `# ${p.title || "Untitled"}\n\n*${t.label}*\n\n${p.logline ? p.logline + "\n\n" : ""}`;
    for(const s of p.sections){
      const k = KINDS[s.kind] || KINDS.notes;
      md += `\n## ${s.name}\n\n`;
      for(const it of s.items){
        md += `### ${it.title || "Untitled " + k.noun}\n\n`;
        for(const f of k.fields){ const val = (it.f||{})[f.k]; if(val && val.trim()) md += (f.label ? `**${f.label}**\n\n` : "") + val.trim() + "\n\n"; }
      }
    }
    const dl = await (window.claude?.use ? window.claude.use("downloads") : null);
    if(!dl){ showNotice("Export needs this page opened inside Claude.", 6000); return; }
    try{ await dl.save({filename: `${(p.title || "untitled").replace(/[^\w\- ]+/g,"").trim() || "untitled"}.md`, data: md}); }
    catch(e){ if(e?.code !== "declined") showNotice("Export didn't finish (" + (e?.code || "error") + "). Try again.", 6000); }
  }

  function context(){
    const p = proj(); if(!p) return "";
    const t = TYPES[p.type] || TYPES.custom;
    let c = `\n\nThe writer's current project in the Redbound Studio: "${p.title || "Untitled"}", a ${t.label.toLowerCase()}.`;
    if(p.logline.trim()) c += ` Logline: ${p.logline.trim()}`;
    c += `\nSections: ` + p.sections.map(s => `${s.name} (${s.items.length})`).join(", ") + ".";
    const chars = p.sections.filter(s => s.kind === "characters").flatMap(s => s.items).map(i => i.title).filter(Boolean).slice(0,20);
    if(chars.length) c += `\nCharacters so far: ${chars.join(", ")}.`;
    const s = sect(), it = item();
    if(s && it){
      const k = KINDS[s.kind] || KINDS.notes;
      let txt = k.fields.map(f => { const val = (it.f||{})[f.k]; return val && val.trim() ? (f.label ? f.label + ": " : "") + val.trim() : ""; }).filter(Boolean).join("\n");
      if(txt.length > 2500) txt = txt.slice(0, 1200) + "\n[…]\n" + txt.slice(-1200);
      c += `\nThey most recently had open the ${k.noun} "${it.title || "untitled"}" in ${s.name}:\n${txt || "(empty so far)"}`;
    }
    return c;
  }

  return { render, context };
})();

/* ---------------- views ---------------- */
function setView(v){
  const studio = v === "studio";
  document.querySelector(".app").classList.toggle("studio-on", studio);
  $("tabCompanion").setAttribute("aria-selected", String(!studio));
  $("tabStudio").setAttribute("aria-selected", String(studio));
  if(S.view !== v){ S.view = v; save(); }
  if(studio) Studio.render();
}
$("tabCompanion").onclick = () => setView("companion");
$("tabStudio").onclick = () => setView("studio");

/* ---------------- boot ---------------- */
Scene.setCalm(S.calm);
applyTheme();
Scene.start();
renderCompanion();
renderThread();
renderVoiceBtn();
setView(S.view === "studio" ? "studio" : "companion");
if("speechSynthesis" in window) speechSynthesis.getVoices();
samplePromise.then(s => { if(!s) showNotice("Open this page inside Claude to let your companions reply. The scene works anywhere.", 0); });
})();
</script>
